# Config nginx du conteneur "static-site", sur le VPS.
#
# Sur le VPS, ce fichier vit dans /home/debian/static-site/nginx.conf, monte
# dans le conteneur en /etc/nginx/conf.d/default.conf. Le deploiement GitHub
# n'envoie que dist/ : ce fichier se recopie a la main, voir DEPLOIEMENT_VPS.md.
#
# Il reprend public/.htaccess, qui n'est lu que par Apache. Le site etant servi
# par nginx, aucune regle du .htaccess ne s'appliquait en production.
#
# Piege nginx : un add_header pose dans un bloc location efface TOUS les
# add_header herites du bloc server. Tous les en-tetes sont donc poses au niveau
# server, et ce qui varie selon le fichier passe par les "map" ci-dessous. Ne
# jamais ajouter d'add_header dans un location.

# Duree de cache selon le fichier demande. Le premier motif qui correspond
# l'emporte, l'ordre compte.
map $uri $cache_control {
    # Les noms produits par Vite portent un hash : leur contenu ne change jamais.
    "~-[A-Za-z0-9_-]{8,}\.(css|js|woff2?)$"  "public, max-age=31536000, immutable";
    # Manifestes de decouverte : les CDN doivent les rafraichir vite.
    ~^/(robots\.txt|llms\.txt|sitemap\.xml)$  "public, max-age=300, must-revalidate";
    # Images sans hash (public/assets/...) : un mois, comme dans le .htaccess.
    ~*\.(png|jpe?g|gif|webp|avif|svg|ico)$  "public, max-age=2592000";
    default  "no-cache";
}

# Pages HTML et jumeaux Markdown sont deux faces d'une meme URL : un cache doit
# savoir que la reponse depend de l'en-tete Accept. Une valeur vide n'envoie
# pas l'en-tete.
map $uri $vary_accept {
    ~(/index\.html|\.md|/llms\.txt)$  "Accept";
    default  "";
}

# Liens de decouverte pour les agents (RFC 8288), sur toute page HTML.
map $uri $link_site {
    ~/index\.html$  '</llms.txt>; rel="describedby"; type="text/markdown", </sitemap.xml>; rel="sitemap"; type="application/xml", </.well-known/api-catalog>; rel="api-catalog", </.well-known/agent-card.json>; rel="service-desc"; type="application/json", </.well-known/agent-skills/index.json>; rel="service-meta"; type="application/json", </schemamap.xml>; rel="describedby"; type="application/xml"';
    default  "";
}

# Le jumeau Markdown n'est declare en en-tete que pour l'accueil : les autres
# pages le declarent dans leur <head> (scripts/prerender.mjs).
map $request_uri $link_home {
    ~^/(index\.html)?(\?.*)?$  '</index.md>; rel="alternate"; type="text/markdown"';
    default  "";
}

# Manifestes lus par des agents depuis une autre origine. Ils sont publics.
map $uri $cors_origin {
    ~/(ard\.json|ai-catalog\.json|agent-card\.json|api-catalog|index\.json|server-card\.json)$  "*";
    default  "";
}

# Un agent demande le Markdown par l'en-tete Accept ou par ?mode=agent.
map $http_accept $accepts_markdown {
    "~*(^|,)\s*text/markdown([;,]|$)"  1;
    default  0;
}

map $arg_mode $agent_mode {
    ~*^agent$  1;
    default  0;
}

map "$accepts_markdown$agent_mode" $serve_markdown {
    ~1  1;
    default  0;
}

server {
    listen 8099;
    root /usr/share/nginx/html/current;
    index index.html;

    # Redirections en chemin relatif. Nginx ecoute sur 8099 derriere un proxy :
    # sans cette ligne il fabrique ses redirections avec sa propre adresse
    # (http + port 8099), injoignable depuis l'exterieur.
    absolute_redirect off;

    # La version de nginx n'apporte rien au visiteur, mais renseigne un attaquant.
    server_tokens off;

    # Les fichiers du site sont tous en UTF-8. Sans cette declaration, un client
    # qui ne devine pas l'encodage affiche les accents et les tirets longs en
    # caracteres bizarres.
    charset utf-8;
    charset_types text/markdown text/plain text/xml text/css application/javascript application/json;

    # Compression entre le serveur et Cloudflare, qui recompresse ensuite pour
    # le visiteur. Les woff2 sont deja compresses, inutile de les reprendre.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/ld+json application/xml application/rss+xml application/linkset+json image/svg+xml;

    # --- En-tetes ---
    # "always" les envoie aussi sur les 404 et 500, pas seulement sur les 200.
    # HSTS n'est pas ici : Cloudflare l'ajoute deja.
    #
    # CSP bloquante. Elle a d'abord tourne en Report-Only (le navigateur signale
    # sans bloquer) : accueil, chatbot et Turnstile ont ete verifies sans aucune
    # violation avant de l'activer. Pour tester un nouveau domaine sans risque,
    # repasser temporairement l'en-tete en Content-Security-Policy-Report-Only.
    # analytics.valentin-fiess.fr est ajoute par rapport au .htaccess : c'est
    # l'adresse de Matomo (src/matomo.js), absente de l'ancienne politique.
    # Ajoutes aussi dans connect-src, releves dans la console en Report-Only :
    # raw.githubusercontent.com (finance.json, pulse.json), api.open-meteo.com
    # (meteo de PulseComponent) et api.iconify.design (icones de @iconify/vue).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://analytics.valentin-fiess.fr https://www.google-analytics.com https://www.googletagmanager.com https://gradio.s3-us-west-2.amazonaws.com https://static.cloudflareinsights.com https://valmtp3-chatbot-ia-cv.hf.space https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://gradio.s3-us-west-2.amazonaws.com https://valmtp3-chatbot-ia-cv.hf.space; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://analytics.valentin-fiess.fr https://raw.githubusercontent.com https://api.open-meteo.com https://api.iconify.design https://www.google-analytics.com https://valmtp3-chatbot-ia-cv.hf.space wss://valmtp3-chatbot-ia-cv.hf.space https://gradio.s3-us-west-2.amazonaws.com https://huggingface.co https://api.emailjs.com https://challenges.cloudflare.com; frame-src 'self' https://valmtp3-chatbot-ia-cv.hf.space https://challenges.cloudflare.com; frame-ancestors 'none';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;
    add_header Vary $vary_accept always;
    add_header Link $link_site always;
    add_header Link $link_home always;
    add_header Access-Control-Allow-Origin $cors_origin always;

    # /index.html tape a la main renvoie vers /, pour n'avoir qu'une adresse
    # par page. $request_uri est l'adresse demandee par le visiteur : le repli
    # interne de la SPA vers /index.html ne declenche donc pas cette redirection.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 /$is_args$args;
    }

    # --- Negociation Markdown ---
    # Accept: text/markdown ou ?mode=agent servent le jumeau .md de la page,
    # s'il existe. Sinon la page HTML reste servie : jamais de 404 pour une page
    # qui n'a simplement pas de jumeau.
    set $markdown_twin "";
    if ($uri = /) {
        set $markdown_twin /index.md;
    }
    if ($uri ~ "^/([a-z0-9-]+(?:/[a-z0-9-]+)*)/?$") {
        set $markdown_twin /$1.md;
    }
    if ($serve_markdown = 0) {
        set $markdown_twin "";
    }
    # Twin vide : le test porte sur le dossier racine, qui n'est pas un fichier.
    if (-f $document_root$markdown_twin) {
        rewrite ^ $markdown_twin last;
    }

    # --- Fichiers interdits ---
    location ~ /\.(git|env) { return 404; }
    location ~* \.(htaccess|htpasswd|ini|log|sh|inc|bak|sql|conf|DS_Store)$ { return 404; }

    # --- Types de contenu ---
    # Un bloc "types" vide remplace la table de nginx pour ce seul location :
    # default_type s'applique alors a coup sur.

    # L'extension .md ne figure pas dans la table des types de nginx.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~ /llms\.txt$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    # RFC 9727 impose ce type, avec le profil, pour le catalogue d'API.
    location = /.well-known/api-catalog {
        types { }
        default_type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"';
        try_files $uri =404;
    }

    location ~ \.jsonl$ {
        types { }
        default_type application/jsonl;
        try_files $uri =404;
    }

    # --- Chemins destines aux machines ---
    # Un fichier absent repond 404 en JSON, pas la coquille HTML de la SPA : un
    # scanner qui recoit du HTML conclut que le manifeste existe mais est casse.
    location ~ ^/(\.well-known|feeds|api)/ {
        try_files $uri =404;
        error_page 404 /errors/404.json;
        error_page 500 /errors/500.json;
    }

    # --- Pages ---
    # $uri/index.html sert les coquilles pre-rendues (/projets ->
    # projets/index.html) sans redirection. Pas de "$uri/" : il ferait une
    # redirection 301 vers l'adresse avec barre finale, que la balise canonical
    # ne declare pas.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
