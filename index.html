<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- SEO. Ces valeurs sont celles de l'accueil : scripts/prerender.mjs les
         reecrit route par route dans dist/ a partir de src/data/seo.js. -->
    <title>Valentin Fiess | Ingénieur IA &amp; Data</title>
    <meta
      content="Ingénieur IA/Data à Montpellier. RAG, LLM, MLOps, Python. Projets, stack technique et parcours."
      name="description"
    />
    <meta content="Valentin Fiess" name="author" />
    <meta content="index, follow" name="robots" />
    <link href="https://valentin-fiess.fr/" rel="canonical" />

    <!-- Representation Markdown de la page, pour les agents. scripts/prerender.mjs
         reecrit ce href route par route. -->
    <link href="https://valentin-fiess.fr/index.md" rel="alternate" type="text/markdown" />

    <!-- JSON-LD. Valeurs de l'accueil ; scripts/prerender.mjs regenere le graphe
         complet route par route depuis scripts/generate-agent-manifests.mjs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://valentin-fiess.fr/#person",
            "name": "Valentin Fiess",
            "jobTitle": "Ingenieur IA / Data",
            "url": "https://valentin-fiess.fr/",
            "sameAs": [
              "https://github.com/ValMtp3",
              "https://www.linkedin.com/in/valentin-fiess/"
            ]
          }
        ]
      }
    </script>

    <!-- Favicon -->
    <link href="/assets/assets_index/val.ico" rel="icon" type="image/ico" />
    <link href="/assets/assets_index/Profile2.jpeg" rel="apple-touch-icon" sizes="180x180" />
    <link href="https://raw.githubusercontent.com" rel="preconnect" />
    <link
      href="https://raw.githubusercontent.com/ValMtp3/Bento-Grid-Portfolio/main/public/assets/assets_index/github-contributions.svg"
      rel="preload"
      as="image"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta content="website" property="og:type" />
    <meta content="Valentin Fiess" property="og:site_name" />
    <meta content="fr_FR" property="og:locale" />
    <meta content="Valentin Fiess | Ingénieur IA &amp; Data" property="og:title" />
    <meta
      content="Ingénieur IA/Data à Montpellier. RAG, LLM, MLOps, Python. Projets, stack technique et parcours."
      property="og:description"
    />
    <meta content="https://valentin-fiess.fr/" property="og:url" />
    <meta content="https://valentin-fiess.fr/assets/og/home.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="Valentin Fiess — Ingénieur IA / Data" property="og:image:alt" />

    <!-- Twitter -->
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="valentin-fiess.fr" property="twitter:domain" />
    <meta content="https://valentin-fiess.fr/" property="twitter:url" />
    <meta content="@WyqBzm" name="twitter:site" />
    <meta content="Valentin Fiess | Ingénieur IA &amp; Data" name="twitter:title" />
    <meta
      content="Ingénieur IA/Data à Montpellier. RAG, LLM, MLOps, Python. Projets, stack technique et parcours."
      name="twitter:description"
    />
    <meta content="https://valentin-fiess.fr/assets/og/home.png" name="twitter:image" />
    <meta content="Valentin Fiess — Ingénieur IA / Data" name="twitter:image:alt" />

    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
      /* Contenu pose par scripts/prerender.mjs dans #app, remplace des que Vue
         monte. Styles minimaux et autonomes : ce bloc s'affiche avant que la
         feuille Tailwind ne soit chargee. */
      .prerendered-content {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        line-height: 1.7;
        color: #3b2a24;
      }
      .prerendered-content h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      .prerendered-content h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 1.75rem 0 0.5rem;
      }
      .prerendered-content ul,
      .prerendered-content ol {
        padding-left: 1.5rem;
      }
      .prerendered-content a {
        color: #2b5fad;
      }
      @media (prefers-color-scheme: dark) {
        .prerendered-content {
          color: #f4d7cb;
        }
        .prerendered-content a {
          color: #7aa7ef;
        }
      }

      @font-face {
        font-family: '0xProto';
        src: url('/assets/Font/0xProto-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script src="/src/main.js" type="module"></script>
  </body>
</html>
